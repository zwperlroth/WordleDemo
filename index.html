<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quordle</title>
  <!-- Bump ?v= when style.css or a .js file changes, so browsers don't mix
       a new page with an old cached file. -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="app">
    <aside class="controls">
      <button id="new-game" type="button">New game</button>
      <button id="music" type="button">Music: on</button>
      <p class="hint">Solve all 4 words<br> in 9 guesses.<br> Type or click letters,<br> Enter to guess.</p>
      <a class="nav-link" href="duel.html">Duel a friend &rarr;</a>
    </aside>

    <section class="game">
      <div id="boards" class="boards"></div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
    </section>
  </main>

  <script src="common.js?v=6"></script>
  <script src="quordle.js?v=6"></script>
</body>
</html>
