<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle Duel</title>
  <!-- Bump ?v= when style.css or a .js file changes, so browsers don't mix
       a new page with an old cached file. -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main class="app">
    <aside class="controls">
      <button id="ready" type="button" disabled>Ready</button>
      <button id="music" type="button">Music: on</button>
      <p class="hint">2 or 3 players open<br> this page. Everyone<br> presses Ready, then<br> race to find the<br> same word.</p>
      <a class="nav-link" href="index.html">&larr; Play Quordle</a>
      <button id="private-room" class="link-button" type="button">New private room</button>
    </aside>

    <section class="game duel">
      <p id="status" class="status" role="status" aria-live="polite">Connecting&hellip;</p>
      <div class="duel-boards">
        <figure class="duel-board">
          <div id="my-board" class="grid"></div>
          <figcaption><span id="my-name">You</span> <span id="my-score" class="score">0</span>
            <span id="my-ready" class="ready-tag" hidden>Ready</span></figcaption>
        </figure>
        <div id="opponents" class="opponents"></div>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
      <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
    </section>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="common.js?v=6"></script>
  <script src="duel.js?v=6"></script>
</body>
</html>
